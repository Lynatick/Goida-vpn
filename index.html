  <script>
    const status = document.getElementById('status');

    async function copyUrl(input) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(input.value);
          return;
        } catch (_) {
          // Try selected-text copying if clipboard permission was denied.
        }
      }
      input.focus();
      input.select();
      input.setSelectionRange(0, input.value.length);
      if (!document.execCommand('copy')) {
        throw new Error('Clipboard unavailable');
      }
    }

    document.querySelectorAll('[data-copy]').forEach(button => {
      button.addEventListener('click', async () => {
        const input = document.getElementById(button.dataset.copy);
        button.disabled = true;
        status.textContent = '';
        try {
          await copyUrl(input);
          button.textContent = 'Скопировано ✓';
          status.textContent = 'Ссылка скопирована. Добавьте её в новый профиль Hiddify.';
          setTimeout(() => { button.textContent = 'Копировать'; }, 2000);
        } catch (_) {
          status.textContent = 'Скопируйте выделенную ссылку вручную: ⌘C на macOS или Ctrl+C на Windows/Linux.';
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
